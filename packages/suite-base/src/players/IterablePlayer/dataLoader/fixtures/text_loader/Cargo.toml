# Test fixture for WasmDataLoader, built twice to cover Foxglove's crate and target range:
#   text_loader.wasm:              this file as is, for wasm32-unknown-unknown
#   text_loader_v0.1_wasip1.wasm:  with foxglove_data_loader = "=0.1.0" and foxglove = "0.9.0",
#                                  for wasm32-wasip1 (WASI imports, older wit-bindgen)
#   cargo build --release --target <target>
[package]
name = "text_loader"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
foxglove = { version = "0.30.2", default-features = false, features = ["derive"] }
foxglove_data_loader = "0.2.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
