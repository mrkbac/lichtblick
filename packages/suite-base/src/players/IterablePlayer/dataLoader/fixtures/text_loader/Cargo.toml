# Test fixture for WasmDataLoader. Rebuild with:
#   cargo build --release --target wasm32-unknown-unknown && cp target/wasm32-unknown-unknown/release/text_loader.wasm ../text_loader.wasm
[package]
name = "text_loader"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
foxglove = { version = "0.30.2", default-features = false, features = ["derive"] }
foxglove_data_loader = "0.2.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
