packages:
  - desktop
  - packages/*
  - packages/@types/*
  - web
  - benchmark

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS, no patched release (<= 4.0.7 is every version). Only build tooling uses it
    # (electron-builder, Storybook docgen) with our own glob patterns. Drop once picomatch ships a fix.
    - GHSA-fc5q-39xc-vjpf
# Don't install missing peers: the default would pull in webpack (we build with rspack) and
# electron-builder's optional Squirrel.Windows target.
autoInstallPeers: false

peerDependencyRules:
  # The ESLint plugins run inside oxlint's JS plugin runtime, which doesn't need ESLint itself.
  ignoreMissing:
    - eslint

# esbuild (only used by Storybook) works without its postinstall check; listing it silences the
# "ignored build scripts" warning.
ignoredBuiltDependencies:
  - esbuild

overrides:
  # Bundle one copy of each instead of two (both copies shipped in the web build):
  # omgidl-serialization pins cdr 3.5.0, rosbag2 asks for schemas ^1, utif for pako ^1.
  "@foxglove/omgidl-serialization>@foxglove/cdr": 3.5.1
  "@foxglove/rosbag2>@foxglove/schemas": 2.3.1
  # Keep Monaco on the same patched DOMPurify as the application.
  "dompurify@<3.4.18": 3.4.18
  # These parents use the named minimatch API retained in v11 (GHSA-g3hv-75wg-m249).
  "@electron/universal@2.0.3>minimatch": 11.0.9
  "app-builder-lib@26.18.0>minimatch": 11.0.9
  # Workbox uses only globSync, retained in v14 (GHSA-3g3m-2fjr-6pw4).
  "workbox-build@7.4.1>glob": 14.0.6
  "utif>pako": ^2.2.0

patchedDependencies:
  "@foxglove/rosbag2@6.0.0": patches/@foxglove__rosbag2@6.0.0.patch
  "@foxglove/ulog@2.3.2": patches/@foxglove__ulog@2.3.2.patch

# TypeScript looks for @types packages in parent node_modules folders. Hoist them to the root so
# each workspace doesn't have to repeat the shared ones. Runtime packages stay strict (isolated).
publicHoistPattern:
  - "@types/*"

# Dependencies are pinned to exact versions; `pnpm add` should keep doing that.
savePrefix: ""
