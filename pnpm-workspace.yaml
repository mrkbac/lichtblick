packages:
  - desktop
  - packages/*
  - packages/@types/*
  - web
  - benchmark

# Dependencies are pinned to exact versions; `pnpm add` should keep doing that.
savePrefix: ""
# Don't install missing peers: the default would pull in webpack (we build with rspack) and
# electron-builder's optional Squirrel.Windows target.
autoInstallPeers: false

overrides:
  # monaco-editor pins a vulnerable dompurify (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr).
  "dompurify@<3.4.17": 3.4.17
  # @actions/tool-cache 2.x pulls undici 5 (several high advisories, e.g. GHSA-2m5v-pch6-74hx).
  "undici@<6.29.1": 6.29.1

# esbuild (only used by Storybook) works without its postinstall check; listing it silences the
# "ignored build scripts" warning.
ignoredBuiltDependencies:
  - esbuild

# TypeScript looks for @types packages in parent node_modules folders. Hoist them to the root so
# each workspace doesn't have to repeat the shared ones. Runtime packages stay strict (isolated).
publicHoistPattern:
  - "@types/*"
