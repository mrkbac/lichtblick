name: CI

on:
  push:
    branches: [licht]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the previous run; cancel it so it doesn't hold runners.
# Runs on licht are never cancelled, so every merge commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    # Run each command in parallel with the same setup steps.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        config:
          # Specify names so that the GitHub branch protection settings for
          # required checks don't need to change if we ever change the commands used.
          # Cheap checks share one job: on the shared runner pool, queue time per job
          # (often minutes) dwarfs these commands' run time (seconds each).
          - name: lint
            # `check` (defined in the run step) keeps going after a failure so every result shows.
            command: |
              check yarn license-check
              check yarn dedupe --check
              # type checks the apps and root files (builds only transpile; packages are checked by build:packages)
              check yarn run typecheck
              check yarn run format:ci
              check yarn run lint:ci
              check yarn run lint:knip
              # last: advisories change without our code changing
              check yarn npm audit --all --recursive --severity high
          - name: build
            command: |
              check yarn run build:packages
              check yarn run web:build:prod
              check yarn run desktop:build:prod
              check yarn run benchmark:build:prod
          - name: test
            command: check yarn run test --maxWorkers=100%

    name: ${{ matrix.config.name }} (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g --force corepack@0.36.0 && corepack enable

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            **/node_modules
          key: v5-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: v5-${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Run checks
        run: |
          failed=0
          check() {
            echo "::group::$*"
            "$@" || { echo "::error::failed: $*"; failed=1; }
            echo "::endgroup::"
          }
          ${{ matrix.config.command }}
          exit $failed

  e2e-desktop:
    # Not on PRs for now: the smoke suite is red on licht and needs its own fix. It still runs on
    # every licht push here and nightly in e2e-regression.yml.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Run smoke tests in parallel across 2 shards
    # Full regression runs separately in e2e-regression.yml (nightly + develop/main)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    name: e2e-desktop (ubuntu-latest) [${{ matrix.shard }}/2]

    # Set a fixed timezone to ensure consistent test results.
    # Lichtblick uses the system's local timezone, which can cause test assertions
    # to fail due to time discrepancies across different environments.
    env:
      TZ: Europe/Lisbon

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g --force corepack@0.36.0 && corepack enable

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            **/node_modules
          key: v5-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: v5-${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Apply AppArmor Fix (Ubuntu)
        # Required for Playwright on Ubuntu to work properly
        # See: https://github.com/microsoft/playwright/issues/34251
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # It must be dev build, otherwise playwright wont't have all data-testid avaiable for icons
      # https://mui.com/material-ui/migration/upgrade-to-v7/#svgicons-data-testid-removed
      - name: Build desktop app
        run: yarn desktop:build:dev

      - name: Run E2E Desktop smoke tests - Shard ${{ matrix.shard }}/2
        uses: coactions/setup-xvfb@v1
        with:
          working-directory: ./
          run: yarn test:e2e:desktop:smoke:ci --shard=${{ matrix.shard }}/2

      - name: Upload Desktop E2E Test Reports (Shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-desktop-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  e2e-web:
    runs-on: ubuntu-latest

    name: e2e-web (ubuntu-latest)

    env:
      TZ: Europe/Lisbon

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g --force corepack@0.36.0 && corepack enable

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            **/node_modules
          key: v5-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: v5-${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Web smoke tests
        run: yarn test:e2e:web:smoke:ci

      - name: Upload Web E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web-reports
          path: e2e/reports/web/
          retention-days: 7
          if-no-files-found: warn

  # Merge reports from all shards and generate summary
  e2e-report:
    # Only merges the desktop shards' reports (e2e-web uploads its own), so it follows e2e-desktop.
    if: always() && github.event_name == 'push'
    needs: [e2e-desktop, e2e-web]
    runs-on: ubuntu-latest

    name: e2e-report (merge all reports)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g --force corepack@0.36.0 && corepack enable

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            **/node_modules
          key: v5-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: v5-${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Download all desktop blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-desktop-*
          path: all-blob-reports-desktop
          merge-multiple: true

      - name: Download web reports
        uses: actions/download-artifact@v8
        with:
          name: e2e-web-reports
          path: e2e/reports/web
        continue-on-error: true

      - name: Merge Desktop Playwright reports
        run: |
          mkdir -p e2e/reports/desktop

          echo "Downloaded desktop blob reports:"
          ls -la all-blob-reports-desktop/ || echo "No desktop blob reports found"

          # Merge blob reports into JSON format
          npx playwright merge-reports --reporter json ./all-blob-reports-desktop > e2e/reports/desktop/results.json

          # Also generate HTML report
          npx playwright merge-reports --reporter html ./all-blob-reports-desktop

          echo "Merged desktop report size:"
          ls -lh e2e/reports/desktop/results.json

      - name: Generate E2E Test Summary
        run: |
          echo "Generating E2E test summary from merged reports..."
          node e2e/ci-helpers/generate-test-summary.ts >> $GITHUB_STEP_SUMMARY

      - name: Upload Merged E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports-merged
          path: |
            e2e/reports/
            playwright-report/
          retention-days: 7
