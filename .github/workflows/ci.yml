name: CI

on:
  push:
    branches: [licht]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the previous run; cancel it so it doesn't hold runners.
# Runs on licht are never cancelled, so every merge commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    # Run each command in parallel with the same setup steps.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        config:
          # Specify names so that the GitHub branch protection settings for
          # required checks don't need to change if we ever change the commands used.
          # Lint and build share one job: the account runs at most 20 jobs at once and PR jobs
          # often wait minutes for a runner, while lint plus build (~2.5 min) still finishes
          # before the e2e jobs. This job also saves the pnpm store on licht.
          - name: lint-build
            save-cache: true
            # `check` (defined in the run step) keeps going after a failure so every result shows.
            command: |
              check pnpm license-check
              check pnpm dedupe --check
              # type checks the apps and root files (builds only transpile; packages are checked by build:packages)
              check pnpm run typecheck
              check pnpm run format:ci
              check pnpm run lint:ci
              check pnpm run lint:knip
              check pnpm run build:packages
              check pnpm run web:build:prod
              check pnpm run desktop:build:prod
              check pnpm run benchmark:build:prod
              # last: advisories change without our code changing
              check pnpm audit --audit-level high
          - name: test
            command: check pnpm run test --maxWorkers=100%

    name: ${{ matrix.config.name }} (${{ matrix.os }})

    permissions:
      contents: read
      # The setup action deletes superseded pnpm store caches after saving one on licht
      actions: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ matrix.config.save-cache == true }}

      - name: Run checks
        run: |
          failed=0
          check() {
            echo "::group::$*"
            "$@" || { echo "::error::failed: $*"; failed=1; }
            echo "::endgroup::"
          }
          ${{ matrix.config.command }}
          exit $failed

  # Compares speed, memory, bytes read and startup bundle size with the PR's merge base
  # (ci/perf-budget.ts). Required on licht, so the job id stays `perf-budget`. It waits for the
  # cheap checks so a broken push doesn't hold a runner, and doesn't run on licht pushes (they
  # could only report). Its table is in the job summary.
  perf-budget:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the PR's labels when the budget is exceeded
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base must be in the clone
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run perf budget
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Exit code 3 means over budget (and nothing worse), which a deliberate trade-off may accept
        # with the `perf-budget-accepted` label. Not comparable (2), a failed base build or a crash
        # always fail. The label is read now, not from the event, so
        # re-running the job after changing the label applies it. The annotations say which way it went.
        run: |
          set +e
          node --expose-gc ci/perf-budget.ts --base "$(git merge-base HEAD "$BASE")"
          code=$?
          if [ "$code" -eq 3 ]; then
            if ! labels=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name'); then
              echo "::error::Couldn't read the PR's labels"
              exit 1
            fi
            if grep -qx perf-budget-accepted <<<"$labels"; then
              echo "::notice title=perf-budget-accepted::Over budget, accepted with the perf-budget-accepted label"
              exit 0
            fi
            echo "::error title=perf-budget-waivable::Over budget; the perf-budget-accepted label would accept it"
          fi
          exit "$code"

  e2e-web:
    runs-on: ubuntu-latest

    name: e2e-web (ubuntu-latest)

    env:
      TZ: Europe/Lisbon

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Web smoke tests
        run: pnpm test:e2e:web:smoke

      - name: Upload Web E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web-reports
          path: e2e/reports/web/
          retention-days: 7
          if-no-files-found: warn

      - name: Generate E2E Test Summary
        if: always()
        run: node e2e/ci-helpers/generate-test-summary.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Web E2E Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
