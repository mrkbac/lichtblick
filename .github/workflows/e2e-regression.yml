name: E2E Regression

# Runs the full E2E test suite (all @smoke + @regression tests).
# Triggered nightly, on every push to licht, and by hand (workflow_dispatch).
# PR CI only runs @smoke tests (see ci.yml).

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  push:
    branches: [licht]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A started run always finishes (cancelling one throws away its runner
# minutes and leaves no result); of the runs still waiting, GitHub keeps only the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-web-regression:
    runs-on: ubuntu-latest

    name: e2e-web-regression (ubuntu-latest)

    env:
      TZ: Europe/Lisbon

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Web regression tests
        run: pnpm test:e2e:web:ci

      - name: Upload Web E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-regression-web-reports
          path: e2e/reports/web/
          retention-days: 7
          if-no-files-found: warn

      - name: Generate E2E Test Summary
        if: always()
        run: node e2e/ci-helpers/generate-test-summary.ts >> "$GITHUB_STEP_SUMMARY"
