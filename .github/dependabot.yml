version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # We found daily updates to be too noisy. They consumed too much CI time and engineer review
      # time relative to the benefit of being on such a bleeding edge.
      interval: monthly
    open-pull-requests-limit: 10
    labels: [dependabot]
    target-branch: "licht"

    # Define groups of dependencies to be updated together
    # https://github.blog/changelog/2023-06-30-grouped-version-updates-for-dependabot-public-beta/
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      oxlint:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
      emotion:
        patterns:
          - "@emotion/*"
      electron:
        patterns:
          - "electron"
          - "electron-*"
          - "builder-util"
      vitest:
        patterns:
          - "vitest"
          - "vite"
          - "@vitest/*"
          - "vitest-*"
      rspack:
        patterns:
          - "@rspack/*"
          - "webpack"
      monaco-editor:
        patterns:
          - "monaco-editor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: [dependabot]
